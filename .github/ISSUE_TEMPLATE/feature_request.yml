name: 功能建议
description: 想要一个新功能，或者觉得某处应该换个做法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说一下这个项目的取向，能省掉一些来回：
        **本机优先、不引入服务端、不引入账号体系**。
        需要联网才能用的功能只有「API 直连生成」，而且它能被关掉、退回纯手工模式。

  - type: textarea
    id: problem
    attributes:
      label: 你在解决什么问题
      description: 先说场景和痛点，别急着说方案
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么表现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过 / 考虑过的其他办法
    validations:
      required: false
