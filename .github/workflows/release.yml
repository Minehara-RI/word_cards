name: Release

# 打 v* 标签时自动出安装包，挂到 GitHub Release 上。
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# 注意：版本号来自 pubspec.yaml，打标签前先把它改对。
# 这个工作流没有在本机执行过（只有推标签才会触发），
# 第一次跑如果哪里不对，按日志调 —— 本地等价命令见 docs/打包与发布.md。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      # 跑一次仓库里的安装包脚本，保证 CI 用的就是本地那套流程
      - name: 打安装包
        run: |
          choco install innosetup --no-progress -y
          pwsh -NoProfile -File scripts/build_windows.ps1 -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  publish:
    name: 发布
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 整理文件名
        run: |
          mkdir -p release
          find artifacts -name '*.apk' -exec cp {} release/word_cards.apk \;
          find artifacts -name '*.exe' -exec cp {} release/word_cards-setup.exe \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
