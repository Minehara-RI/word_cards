name: Release

# 打 v* 标签时自动编译两个平台，并把安装包挂到 GitHub Release 上。
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# 版本号只有一个来源：pubspec.yaml 的 version:。标签名要与它一致，
# 不一致就直接失败，免得挂出一份名字对不上的包。
#
# 也可以在 Actions 页面手动触发：这时只编译、不建 Release，用来确认两个平台还编译得过。
#
# Release 附件与本机 scripts/build_release.ps1 出的东西一致，说明见 docs/构建与发布.md。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Linux 运行器自带 Android SDK（ANDROID_HOME、platform-tools、build-tools 都在），
      # 缺什么 Gradle 会按已接受的许可自己下载，这里不用再装一遍。
      # 原先用的 android-actions/setup-android@v3 会因为 sdkmanager 里
      # 已经没有 "tools" 这个包而直接失败。

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # 走仓库里那套脚本，保证 CI 与本机是同一个流程、同一套文件名。
      - name: 编译并打包
        run: |
          choco install innosetup --no-progress -y
          pwsh -NoProfile -File scripts/build_windows.ps1 -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/word_cards-setup-*.exe
            dist/word_cards-win-x64.zip
          if-no-files-found: error

  publish:
    name: 发布
    runs-on: ubuntu-latest
    needs: [android, windows]
    # 手动触发时只编译，不建 Release。
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理文件名
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          if [ -z "$version" ]; then
            echo "::error::pubspec.yaml 里读不到 version"
            exit 1
          fi
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 pubspec.yaml 的 version $version 不一致"
            exit 1
          fi

          mkdir -p release
          find artifacts -name '*.apk' -exec cp {} "release/word_cards-$version.apk" \;
          find artifacts -name '*.exe' -exec cp {} "release/word_cards-setup-$version.exe" \;
          find artifacts -name '*.zip' -exec cp {} "release/word_cards-win-x64.zip" \;

          # 正文取自 CHANGELOG 里这一版的那一段：自动生成的提交列表会混进
          # 开发过程的措辞，不适合放在给人看的发布页上。
          awk '/^## \[/{n++; if (n==2) exit} n==1' CHANGELOG.md | grep -v '^\[[^]]*\]:' > notes.md
          # Release 页面不解析仓库相对路径，把文档链接改成绝对地址。
          sed -i -E "s#\]\(docs/#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/#g" notes.md
          sed -i -E "s#\]\(CHANGELOG\.md\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)#g" notes.md
          printf '\n---\n\n| 下载 | 给谁 |\n|---|---|\n| word_cards-%s.apk | 安卓手机 |\n| word_cards-setup-%s.exe | Windows 电脑，双击安装 |\n| word_cards-win-x64.zip | Windows 免安装，解压就跑 |\n' "$version" "$version" >> notes.md

          ls -la release
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md
