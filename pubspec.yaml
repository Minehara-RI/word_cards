name: word_flashcards
description: "AI 驱动的单词卡片学习应用：生成释义与干扰项，做限时五选一测验，数据只存本机"
# 这是应用不是库，不发到 pub.dev。
publish_to: 'none'

# 版本号只有一个来源：安装包与 APK 的文件名都由 build 脚本从这里读。
# 格式 主.次.修订+构建号；Android 用 versionName/versionCode，Windows 用前三位 + 构建号。
version: 1.3.0+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3

  # 本地存储：应用数据直接用 Anki 的原生 SQLite 格式
  sqlite3: ^3.7.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  path_provider: ^2.1.6
  # 只留给旧版数据的迁移用（v1 之前是 sembast），新数据一律进 SQLite
  sembast: ^3.9.0

  # 联网与摘要：API 直连生成 + 缓存键与卡片 id 的 sha256
  http: ^1.6.0
  crypto: ^3.0.7

  # 复习算法（FSRS-6）
  fsrs: ^2.0.1

  # 桌面端：演示另开窗口 + 直接调 Win32 把它最大化
  desktop_multi_window: ^0.3.1
  ffi: ^2.2.0

  # 杂项：稳定 id、翻页提示音、导出时选保存位置
  uuid: ^4.6.0
  audioplayers: ^6.8.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
