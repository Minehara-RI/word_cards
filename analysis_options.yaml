# 静态检查配置。
#
# 底线：flutter analyze 必须输出 "No issues found!" —— 连 info 级 lint 也算问题。
# 提交前跑 scripts\verify.ps1，它会先过这一关。
#
# 规则集来自 flutter_lints（官方推荐），下面只做两件事：
# 排除生成物 / 平台模板代码，以及补上一条项目风格的硬性要求。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # 生成物与平台模板代码不参与检查
    - build/**
    - android/**
    - windows/**

linter:
  rules:
    # 统一单引号：Dart 社区的默认风格，避免同一个文件里两种引号混用。
    prefer_single_quotes: true

# 更多可用的 lint 见 https://dart.dev/lints
# 单个文件临时豁免：在文件顶部写 ignore_for_file 注释，后接规则名。
